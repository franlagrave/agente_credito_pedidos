<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>{{ nombre_agente }}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --texto: #1f2430;
    --texto-suave: #6b7280;
    --borde: #e2e4e9;
    --comercial: #2563eb;
    --comercial-bg: #eaf1ff;
    --agente-bg: #f0f1f4;
    --tool-bg: #fbf7ec;
    --tool-borde: #e8dcb0;
    --alerta-bg: #fdecec;
    --alerta-borde: #f3b4b4;
    --ok: #1a7f37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--texto);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--borde);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 16px; margin: 0; }
  header .modelo { font-size: 12px; color: var(--texto-suave); }
  header button {
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--borde);
    background: var(--panel);
    cursor: pointer;
  }
  header button:hover { background: var(--bg); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }

  .burbuja {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.45;
    font-size: 14px;
  }
  .burbuja.comercial {
    align-self: flex-end;
    background: var(--comercial-bg);
    border: 1px solid #cfe0ff;
    white-space: pre-wrap;
  }
  .burbuja.agente {
    align-self: flex-start;
    background: var(--agente-bg);
    border: 1px solid var(--borde);
    max-width: 88%;
  }
  .etiqueta {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--texto-suave);
    margin-bottom: 4px;
  }
  .comercial .etiqueta { color: var(--comercial); text-align: right; }

  /* Contenido Markdown renderizado dentro de la burbuja del agente */
  .md-content > *:first-child { margin-top: 0; }
  .md-content > *:last-child { margin-bottom: 0; }
  .md-content p { margin: 0 0 8px; }
  .md-content ul, .md-content ol { margin: 0 0 8px; padding-left: 22px; }
  .md-content li { margin: 2px 0; }
  .md-content strong { font-weight: 700; }
  .md-content code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    background: rgba(0,0,0,.06);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 12.5px;
  }
  .md-content pre {
    background: #1f2430;
    color: #e6e8ee;
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 0 0 8px;
  }
  .md-content pre code { background: none; padding: 0; color: inherit; }
  .md-content .table-scroll {
    overflow-x: auto;
    margin: 0 0 10px;
    max-width: 100%;
  }
  .md-content table {
    border-collapse: collapse;
    margin: 0;
    font-size: 13px;
  }
  .md-content th, .md-content td {
    border: 1px solid var(--borde);
    padding: 6px 10px;
    text-align: left;
    white-space: nowrap;
  }
  .md-content th { background: rgba(0,0,0,.04); font-weight: 700; }
  .md-content h1, .md-content h2, .md-content h3 {
    margin: 4px 0 8px;
    line-height: 1.3;
  }
  .md-content h1 { font-size: 17px; }
  .md-content h2 { font-size: 15.5px; }
  .md-content h3 { font-size: 14.5px; }
  .md-content blockquote {
    margin: 0 0 8px;
    padding: 4px 10px;
    border-left: 3px solid var(--borde);
    color: var(--texto-suave);
  }
  .md-content a { color: var(--comercial); }

  .tool-card {
    align-self: flex-start;
    max-width: 90%;
    background: var(--tool-bg);
    border: 1px solid var(--tool-borde);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12.5px;
  }
  .tool-card summary { cursor: pointer; font-weight: 600; }
  .tool-card pre {
    margin: 6px 0 0;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    background: #fffdf6;
    border-radius: 6px;
    padding: 8px;
  }
  .tool-card .estado { font-size: 11px; color: var(--texto-suave); margin-left: 6px; }

  .pensando { align-self: flex-start; font-size: 13px; color: var(--texto-suave); font-style: italic; }

  .aviso {
    align-self: center;
    font-size: 12px;
    color: var(--texto-suave);
  }

  .error-msg {
    align-self: center;
    background: var(--alerta-bg);
    border: 1px solid var(--alerta-borde);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
  }

  #aprobacion {
    align-self: center;
    width: 100%;
    max-width: 560px;
    background: var(--alerta-bg);
    border: 1px solid var(--alerta-borde);
    border-radius: 10px;
    padding: 14px 16px;
  }
  #aprobacion h3 { margin: 0 0 6px; font-size: 14px; }
  #aprobacion p { margin: 4px 0; font-size: 13px; color: var(--texto-suave); }
  #aprobacion pre {
    background: #fff;
    border-radius: 6px;
    padding: 8px;
    font-size: 12px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    white-space: pre-wrap;
  }
  #aprobacion .fila { display: flex; gap: 8px; margin-top: 8px; }
  #aprobacion input[type=text] {
    flex: 1;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--borde);
    font-size: 13px;
  }
  #aprobacion .botones { display: flex; gap: 8px; margin-top: 10px; }
  #aprobacion button {
    flex: 1;
    padding: 8px 10px;
    border-radius: 6px;
    border: none;
    font-size: 13px;
    cursor: pointer;
  }
  #aprobacion .aprobar { background: var(--ok); color: white; }
  #aprobacion .rechazar { background: #b42318; color: white; }
  #aprobacion .resuelta { font-size: 13px; font-weight: 600; margin-top: 8px; }

  form#form {
    border-top: 1px solid var(--borde);
    background: var(--panel);
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }
  form#form input[type=text] {
    flex: 1;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--borde);
    font-size: 14px;
  }
  form#form button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: var(--comercial);
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  form#form button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <div>
    <h1>{{ nombre_agente }}</h1>
    <div class="modelo">modelo: {{ modelo }} · vista en vivo de la conversación Comercial ↔ Agente</div>
  </div>
  <button id="btnReiniciar">Nueva conversación</button>
</header>

<div id="chat"></div>

<form id="form">
  <input type="text" id="mensaje" placeholder="Escribí como si fueras del equipo comercial..." autocomplete="off">
  <button type="submit" id="btnEnviar">Enviar</button>
</form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('mensaje');
const btnEnviar = document.getElementById('btnEnviar');
const btnReiniciar = document.getElementById('btnReiniciar');

let pensandoEl = null;
let colaTools = []; // tool_llamada en orden -> se completan en el mismo orden con tool_resultado

function scrollAbajo() {
  chat.scrollTop = chat.scrollHeight;
}

function agregarBurbuja(rol, texto) {
  quitarPensando();
  const div = document.createElement('div');
  div.className = 'burbuja ' + rol;
  const etiqueta = document.createElement('div');
  etiqueta.className = 'etiqueta';
  etiqueta.textContent = rol === 'comercial' ? 'Comercial' : 'Agente';
  div.appendChild(etiqueta);
  const cuerpo = document.createElement('div');
  if (rol === 'agente') {
    // El agente suele responder en Markdown (tablas, listas, negritas) —
    // se renderiza a HTML real en vez de mostrarlo como texto plano,
    // que quedaba "escalonado" al no poder alinear tablas/listas.
    cuerpo.className = 'md-content';
    cuerpo.innerHTML = DOMPurify.sanitize(marked.parse(texto));
    // Las tablas no se comprimen (nowrap): si son más anchas que la
    // burbuja, se desplazan horizontalmente en vez de partir el texto
    // de columnas como el CUIT en varios renglones.
    cuerpo.querySelectorAll('table').forEach((tabla) => {
      const scroll = document.createElement('div');
      scroll.className = 'table-scroll';
      tabla.parentNode.insertBefore(scroll, tabla);
      scroll.appendChild(tabla);
    });
  } else {
    cuerpo.textContent = texto;
  }
  div.appendChild(cuerpo);
  chat.appendChild(div);
  scrollAbajo();
}

function mostrarPensando() {
  if (pensandoEl) return;
  pensandoEl = document.createElement('div');
  pensandoEl.className = 'pensando';
  pensandoEl.textContent = 'El agente está pensando…';
  chat.appendChild(pensandoEl);
  scrollAbajo();
}

function quitarPensando() {
  if (pensandoEl) {
    pensandoEl.remove();
    pensandoEl = null;
  }
}

function agregarToolLlamada(nombre, input) {
  quitarPensando();
  const details = document.createElement('details');
  details.className = 'tool-card';
  details.open = false;
  const summary = document.createElement('summary');
  summary.innerHTML = 'Tool: <code>' + nombre + '</code><span class="estado"> ejecutando…</span>';
  details.appendChild(summary);
  const preInput = document.createElement('pre');
  preInput.textContent = 'Input:\n' + JSON.stringify(input, null, 2);
  details.appendChild(preInput);
  chat.appendChild(details);
  scrollAbajo();
  colaTools.push({ el: details, summary, resuelto: false });
}

function completarToolResultado(nombre, resultado) {
  const pendiente = colaTools.find(t => !t.resuelto);
  if (!pendiente) return;
  pendiente.resuelto = true;
  pendiente.summary.innerHTML = 'Tool: <code>' + nombre + '</code><span class="estado"> resultado listo</span>';
  const preResultado = document.createElement('pre');
  preResultado.textContent = 'Resultado:\n' + JSON.stringify(resultado, null, 2);
  pendiente.el.appendChild(preResultado);
  scrollAbajo();
}

function agregarError(mensaje) {
  quitarPensando();
  const div = document.createElement('div');
  div.className = 'error-msg';
  div.textContent = 'Error: ' + mensaje;
  chat.appendChild(div);
  scrollAbajo();
}

// --- Aprobación humana ---
const aprobacionTemplate = (toolInput) => `
  <h3>Acción irreversible: liberar_pedido con es_excepcion = true</h3>
  <p>El agente necesita aprobación humana explícita antes de ejecutar esto:</p>
  <pre>${JSON.stringify(toolInput, null, 2)}</pre>
  <div class="fila">
    <input type="text" id="aprobadoPor" placeholder="Tu nombre o rol (para dejarlo registrado)">
  </div>
  <div class="botones">
    <button class="aprobar" id="btnAprobar">Aprobar excepción</button>
    <button class="rechazar" id="btnRechazar">Rechazar</button>
  </div>
`;

function mostrarAprobacion(toolInput) {
  quitarPensando();
  const div = document.createElement('div');
  div.id = 'aprobacion';
  div.innerHTML = aprobacionTemplate(toolInput);
  chat.appendChild(div);
  scrollAbajo();
  deshabilitarEnvio(true);

  div.querySelector('#btnAprobar').onclick = () => resolverAprobacion(div, true);
  div.querySelector('#btnRechazar').onclick = () => resolverAprobacion(div, false);
}

async function resolverAprobacion(div, aprobar) {
  const aprobadoPor = div.querySelector('#aprobadoPor').value.trim();
  div.querySelectorAll('button').forEach(b => b.disabled = true);
  await fetch('/aprobar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ aprobar, aprobado_por: aprobadoPor }),
  });
}

function marcarAprobacionResuelta(aprobado, aprobadoPor) {
  const div = document.getElementById('aprobacion');
  if (!div) return;
  const nota = document.createElement('div');
  nota.className = 'resuelta';
  nota.style.color = aprobado ? '#1a7f37' : '#b42318';
  nota.textContent = aprobado
    ? 'Aprobado por: ' + (aprobadoPor || '(sin nombre informado)')
    : 'Rechazado — el pedido queda bloqueado.';
  div.appendChild(nota);
}

function deshabilitarEnvio(deshabilitar) {
  input.disabled = deshabilitar;
  btnEnviar.disabled = deshabilitar;
}

// --- SSE ---
const es = new EventSource('/stream');
es.onmessage = (e) => {
  const evento = JSON.parse(e.data);
  switch (evento.tipo) {
    case 'usuario':
      agregarBurbuja('comercial', evento.texto);
      break;
    case 'pensando':
      mostrarPensando();
      break;
    case 'agente_texto':
      agregarBurbuja('agente', evento.texto);
      break;
    case 'tool_llamada':
      agregarToolLlamada(evento.nombre, evento.input);
      break;
    case 'tool_resultado':
      completarToolResultado(evento.nombre, evento.resultado);
      break;
    case 'aprobacion_requerida':
      mostrarAprobacion(evento.tool_input);
      break;
    case 'aprobacion_resuelta':
      marcarAprobacionResuelta(evento.aprobado, evento.aprobado_por);
      deshabilitarEnvio(false);
      break;
    case 'fin_turno':
      quitarPensando();
      colaTools = [];
      deshabilitarEnvio(false);
      input.focus();
      break;
    case 'error':
      agregarError(evento.mensaje);
      deshabilitarEnvio(false);
      break;
    case 'reiniciado':
      chat.innerHTML = '';
      colaTools = [];
      deshabilitarEnvio(false);
      break;
  }
};

// --- Envío de mensajes ---
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const mensaje = input.value.trim();
  if (!mensaje) return;
  input.value = '';
  deshabilitarEnvio(true);
  await fetch('/enviar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mensaje }),
  });
});

btnReiniciar.addEventListener('click', async () => {
  await fetch('/reiniciar', { method: 'POST' });
});
</script>
</body>
</html>
